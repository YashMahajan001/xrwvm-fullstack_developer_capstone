name: CI/CD Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f server/requirements.txt ]; then pip install -r server/requirements.txt; fi
    - name: Lint with flake8
      run: |
        flake8 server/djangoapp --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 server/djangoapp --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
